server.port=${PORT:8080}

# MongoDB Configuration (support Render / MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pocketmentor}
spring.data.mongodb.auto-index-creation=true

# File upload limit (e.g. up to 25MB PDF)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
app.jwt.secret=PocketMentorSecretKeyWithSuperSecure256BitOrHigherEncodingForStudyApp!
app.jwt.expiration-ms=86400000

# AI Configuration (Optional Gemini / OpenAI key; intelligent built-in fallback parser if unset)
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-1.5-flash
app.ai.openai.api-key=${OPENAI_API_KEY:}

# Storage upload directory
app.storage.upload-dir=uploads
